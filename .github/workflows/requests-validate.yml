name: requests-validate

# PR 里新增/修改 requests/*.yml 时跑：纯格式 + 仓库存在性校验，
# 不需要任何 secret（用 runner 自带的 github.token 调 GitHub API），也不消耗 LLM。
# 结论会就地更新到 PR 评论里（同一条评论反复更新，不刷屏）。
on:
  pull_request:
    paths:
      - "requests/**"
      - "tools/**"
      - ".github/workflows/requests-validate.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: requests-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install --quiet --disable-pip-version-check pyyaml

      - name: 找出本次 PR 改动的请求文件
        id: changed
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "$BASE_REF"
          files=$(git diff --name-only --diff-filter=d "origin/$BASE_REF...HEAD" -- requests/ | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "改动文件：${files:-（无）}"

      - name: 校验并生成报告
        id: validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 tools/validate_requests.py ${{ steps.changed.outputs.files }} > report.md 2>&1
          code=$?
          set -e
          cat report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: 把报告写进 PR 评论
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker="<!-- repo2gal-validate -->"
          comment_id=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -1 || true)
          if [ -n "${comment_id:-}" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$comment_id" -F body=@report.md > /dev/null
            echo "已更新既有评论 $comment_id"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@report.md > /dev/null
            echo "已新建评论"
          fi

      - name: 结论
        if: steps.validate.outputs.code != '0'
        run: |
          echo "::error::请求文件校验未通过，具体问题见 PR 评论"
          exit 1