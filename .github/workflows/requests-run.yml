name: requests-run

# 合并到 main 的请求文件 → 逐个生成并部署（复用 generate-galgame.yml 的可调用入口）。
# 去重：同一站点已经用"同一个源提交"生成过就跳过（状态存在产物里的 site-meta.json），
# 所以多个 fork 重复提同一个仓库也不会重复烧 LLM；要强制重做就写 force: true 或手动 force 触发。
on:
  push:
    branches: [main]
    paths:
      - "requests/**.yml"
      - "requests/**.yaml"
      - "tools/**"
      - ".github/workflows/requests-run.yml"
      - ".github/workflows/generate-galgame.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略去重，requests/ 下全部重做"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.plan.outputs.count }}
      skipped: ${{ steps.plan.outputs.skipped }}
      skipped_detail: ${{ steps.plan.outputs.skipped_detail }}
      slugs: ${{ steps.plan.outputs.slugs }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install --quiet --disable-pip-version-check pyyaml

      - name: 产出生成计划
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCE: ${{ inputs.force }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          args=( --all )
          if [ "$EVENT" = "push" ]; then
            args=( --diff "$BEFORE" "$HEAD_SHA" )
          fi
          if [ "$FORCE" = "true" ]; then
            args+=( --ignore-state )
          fi
          python3 tools/plan_requests.py "${args[@]}" >> "$GITHUB_OUTPUT" 2> plan.log
          code=$?
          set -e
          cat plan.log
          cat plan.log >> "$GITHUB_STEP_SUMMARY"
          exit $code

  generate:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/generate-galgame.yml
    with:
      target_repo: ${{ matrix.repo }}
      mode: ${{ matrix.mode }}
      profile: ${{ matrix.profile }}
      asset_pack: ${{ matrix.asset_pack }}
      slug: ${{ matrix.slug }}
      source_commit: ${{ matrix.source_commit }}
    secrets: inherit

  summary:
    needs: [plan, generate]
    if: always() && (needs.plan.outputs.count != '0' || needs.plan.outputs.skipped != '0')
    runs-on: ubuntu-latest
    steps:
      - name: 汇总站点链接
        env:
          SLUGS: ${{ needs.plan.outputs.slugs }}
          SKIPPED_DETAIL: ${{ needs.plan.outputs.skipped_detail }}
          RESULT: ${{ needs.generate.result }}
        run: |
          set -euo pipefail
          {
            echo "### 请求生成结果"
            echo ""
            echo "- 触发方式：${{ github.event_name }}"
            echo "- 生成任务结论：$RESULT"
            echo ""
            if [ -n "${SLUGS:-}" ]; then
              echo "| 站点 | 直链 |"
              echo "| --- | --- |"
              for slug in ${SLUGS//,/ }; do
                echo "| https://$slug.repo2gal-gallery.pages.dev | https://$slug.repo2gal-gallery.pages.dev/demo |"
              done
            else
              echo "本次没有需要生成的请求。"
            fi
            if [ -n "${SKIPPED_DETAIL:-}" ]; then
              echo ""
              echo "跳过的请求："
              echo ""
              echo "$SKIPPED_DETAIL" | tr '|' '\n' | sed 's/^ *//; s/^/- /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"